<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini-Mart – Record Sale</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Segoe UI,sans-serif;margin:0;background:#f0f4f8}
body.dark{background:#1e1e1e;color:#fff}
header{background:#4facfe;color:#fff;padding:15px;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 15px rgba(0,0,0,.1)}
body.dark table{background:#2b2b2b}
th,td{padding:12px;border-bottom:1px solid #ddd}
body.dark th,body.dark td{border-bottom:1px solid #444}
th{background:#4facfe;color:#fff}
button{padding:6px 12px;border:none;border-radius:6px;background:#4facfe;color:#fff;cursor:pointer}
button:hover{background:#00f2fe;color:#333}
.low-stock{color:red;font-weight:bold}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.filters input,.filters select{padding:8px;border-radius:6px;border:1px solid #ccc}
</style>
</head>

<body>

<header>
  <h2>Record Sale</h2>
  <span style="cursor:pointer" onclick="toggleTheme()">🌙 Theme</span>
</header>

<main style="padding:20px;max-width:1100px;margin:auto">
  <div id="welcome"></div>

  <div class="filters">
    <input id="search" placeholder="Search product" oninput="render()">
    <select id="category" onchange="render()">
      <option value="">All Categories</option>
      <option>Dairy</option><option>Bakery</option><option>Beverages</option>
      <option>Drugs</option><option>Cream</option><option>Cosmetics</option>
      <option>Underwear</option><option>Stationeries</option><option>Drinks</option>
      <option>Snacks</option><option>Household</option><option>Other</option>
    </select>
  </div>

  <div id="table"></div>

  <div style="margin-top:20px">
    <a href="dashboard.html">⬅ Dashboard</a>
  </div>
</main>

<script>
/* ---------- THEME ---------- */
if(sessionStorage.getItem('darkMode')==='true')document.body.classList.add('dark')
function toggleTheme(){
  document.body.classList.toggle('dark')
  sessionStorage.setItem('darkMode',document.body.classList.contains('dark'))
}

/* ---------- USER ---------- */
const username=sessionStorage.getItem('username')||'Staff'
const role=sessionStorage.getItem('role')||'staff'
document.getElementById('welcome').textContent=`Welcome, ${username} (${role.toUpperCase()})`

/* ---------- STORAGE ---------- */
const PRODUCT_KEY='products'
const SALES_KEY='sales'

const getProducts=()=>JSON.parse(sessionStorage.getItem(PRODUCT_KEY)||'[]')
const setProducts=p=>sessionStorage.setItem(PRODUCT_KEY,JSON.stringify(p))
const getSales=()=>JSON.parse(sessionStorage.getItem(SALES_KEY)||'[]')
const setSales=s=>sessionStorage.setItem(SALES_KEY,JSON.stringify(s))

/* ---------- RENDER ---------- */
function render(){
  const products=getProducts()
  const q=document.getElementById('search').value.toLowerCase()
  const c=document.getElementById('category').value

  const list=products.filter(p=>
    p.name.toLowerCase().includes(q) &&
    (c? p.category===c:true)
  )

  if(!list.length){
    document.getElementById('table').innerHTML='<p>No products found</p>'
    return
  }

  let html=`<table><thead><tr>
    <th>ID</th><th>Name</th><th>Category</th><th>Stock</th>
    <th>Selling ₦</th>
    ${role==='admin'?'<th>Cost ₦</th><th>Profit/Unit ₦</th>':''}
    <th>Qty</th><th>Action</th>
  </tr></thead><tbody>`

  list.forEach(p=>{
    const profitUnit=p.sellingPrice-p.costPrice
    html+=`<tr>
      <td>${p.id}</td>
      <td>${p.name}</td>
      <td>${p.category}</td>
      <td class="${p.quantity<=5?'low-stock':''}">${p.quantity}</td>
      <td>${p.sellingPrice}</td>
      ${role==='admin'?`<td>${p.costPrice}</td><td>${profitUnit}</td>`:''}
      <td><input type="number" min="1" max="${p.quantity}" id="q${p.id}" style="width:60px"></td>
      <td><button onclick="sell(${p.id})">Sell</button></td>
    </tr>`
  })

  html+='</tbody></table>'
  document.getElementById('table').innerHTML=html
}

/* ---------- SELL ---------- */
function sell(id){
  let products=getProducts()
  let sales=getSales()
  const p=products.find(x=>x.id===id)
  if(!p)return alert('Product missing')

  const qty=Number(document.getElementById('q'+id).value)
  if(!qty||qty<1)return alert('Invalid quantity')
  if(qty>p.quantity)return alert('Insufficient stock')

  p.quantity-=qty
  setProducts(products)

  const sale={
    id:Date.now(),
    productId:p.id,
    productName:p.name,
    quantity:qty,
    sellingPrice:p.sellingPrice,
    costPrice:p.costPrice, // 🔒 hidden from staff UI
    profit:(p.sellingPrice-p.costPrice)*qty,
    staff:username,
    date:new Date().toISOString()
  }

  sales.push(sale)
  setSales(sales)

  alert(`Sold ${qty} × ${p.name}`)
  render()
}

render()
</script>

</body>
</html>
