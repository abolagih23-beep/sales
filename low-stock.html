<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-Mart – Low Stock & High Demand</title>
<style>
body{font-family:'Segoe UI',sans-serif;margin:0;padding:0;background:#f0f4f8;transition:background .5s,color .5s;}
body.dark{background:#1e1e1e;color:#fff}
header{background:#4facfe;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;}
body.dark header{background:#00bfff}
header h1{margin:0;font-size:22px}
.theme-toggle,.logout-btn{cursor:pointer;font-size:15px;padding:6px 12px;border-radius:6px;border:none;font-weight:bold;}
.theme-toggle{background:#fff;color:#333}
.theme-toggle:hover{background:#e0e0e0}
.logout-btn{background:#ff6b6b;color:#fff}
.logout-btn:hover{background:#ff4d4d}
main{padding:20px;max-width:900px;margin:auto;}
.alert-container{display:flex;flex-direction:column;gap:15px;margin-top:20px;}
.alert-card{padding:15px 20px;border-radius:12px;color:#fff;box-shadow:0 6px 15px rgba(0,0,0,.15);font-size:16px;}
.low-stock{background:#ff6b6b}
.high-demand{background:#ffa500}
body.dark .low-stock{background:#ff4d4d}
body.dark .high-demand{background:#ff9500}
.no-alerts{font-size:16px;margin-top:20px;color:#555;}
body.dark .no-alerts{color:#ccc}
.links{margin-top:25px;display:flex;gap:10px;flex-wrap:wrap;}
.links a{padding:10px 15px;background:#4facfe;color:#fff;border-radius:8px;text-decoration:none;font-weight:bold;}
.links a:hover{background:#00f2fe;color:#333}
body.dark .links a{background:#00bfff}
body.dark .links a:hover{background:#4facfe;color:#fff}
</style>
</head>

<body>
<header>
  <h1>Low Stock & High Demand</h1>
  <div>
    <span class="theme-toggle" onclick="toggleTheme()">🌙 Theme</span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<main>
  <div class="alert-container" id="alertContainer"></div>
  <div class="links" id="links"></div>
</main>

<script>
// ---------------- THEME ----------------
function toggleTheme(){
  document.body.classList.toggle('dark');
  sessionStorage.setItem('darkMode', document.body.classList.contains('dark'));
}
if(sessionStorage.getItem('darkMode')==='true') document.body.classList.add('dark');

// ---------------- AUTH ----------------
const role = sessionStorage.getItem('role');
const username = sessionStorage.getItem('username');

if(!username){
  alert('Please login first.');
  window.location.href='index.html';
}
if(role!=='admin'){
  alert('Access denied. Admin only.');
  window.location.href='dashboard.html';
}

// ---------------- LOGOUT ----------------
function logout(){
  if(confirm('Are you sure you want to logout?')){
    sessionStorage.clear();
    window.location.href='index.html';
  }
}

// ---------------- SAFE DATA LOADERS ----------------
function getProducts(){
  try{
    return JSON.parse(sessionStorage.getItem('products')) || [];
  }catch{ return []; }
}

function getSales(){
  try{
    return JSON.parse(sessionStorage.getItem('sales')) || [];
  }catch{ return []; }
}

// ---------------- RENDER ALERTS ----------------
const alertContainer=document.getElementById('alertContainer');
function renderAlerts(){
  alertContainer.innerHTML='';
  const products=getProducts();
  const sales=getSales();

  // Low Stock (≤3)
  const lowStock=products.filter(p => Number(p.quantity) <= 3);
  lowStock.forEach(p=>{
    const div=document.createElement('div');
    div.className='alert-card low-stock';
    div.textContent=`⚠️ Low Stock: ${p.name} — Only ${p.quantity} left`;
    alertContainer.appendChild(div);
  });

  // High Demand (sold ≥5 units)
  const demandCount={};
  sales.forEach(s=>{
    if(!s.product || !s.quantity) return;
    demandCount[s.product]=(demandCount[s.product]||0)+Number(s.quantity);
  });
  Object.keys(demandCount).filter(name=>demandCount[name]>=5).forEach(name=>{
    const div=document.createElement('div');
    div.className='alert-card high-demand';
    div.textContent=`🔥 High Demand: ${name} sold ${demandCount[name]} units`;
    alertContainer.appendChild(div);
  });

  if(alertContainer.children.length===0){
    const div=document.createElement('div');
    div.className='no-alerts';
    div.textContent='No low-stock or high-demand items currently.';
    alertContainer.appendChild(div);
  }
}
renderAlerts();

// ---------------- REAL-TIME SYNC ----------------
window.addEventListener('storage', renderAlerts);

// ---------------- NAVIGATION ----------------
const linksDiv=document.getElementById('links');
[
  ['Dashboard','dashboard.html'],
  ['Add Product','add-product.html'],
  ['Product List','product-list.html'],
  ['Record Sale','record-sale.html'],
  ['Staff Accountability','staff-accountability.html'],
  ['Reports','reports.html']
].forEach(([text,href])=>{
  const a=document.createElement('a');
  a.href=href;
  a.textContent=text;
  linksDiv.appendChild(a);
});
</script>
</body>
</html>
