<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sales</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
<h1>Sales Page</h1>

<div class="card">
    <input type="text" id="searchProduct" placeholder="Search Product">
    <ul id="productResults"></ul>
</div>

<a href="index.html"><button>Back to Dashboard</button></a>
</div>

<button id="darkToggle">Toggle Dark Mode</button>

<script type="module">
import { renderSearchResults } from "./js/sales.js";
renderSearchResults("searchProduct","productResults");

// Dark Mode
const toggleBtn = document.getElementById("darkToggle");
toggleBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
});
if(localStorage.getItem("darkMode")==="true") document.body.classList.add("dark");
</script>
</body>
</html>
