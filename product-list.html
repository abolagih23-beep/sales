<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-Store - Add Product</title>
<style>
body { font-family:'Segoe UI',sans-serif; margin:0; padding:0; background:#f0f4f8; transition:0.5s; }
body.dark { background:#1e1e1e; color:#fff; }
header { background:#4facfe; color:white; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; }
body.dark header { background:#00bfff; }
header h1 { margin:0; font-size:24px; }
.theme-toggle { cursor:pointer; font-size:16px; }
main { padding:20px; max-width:900px; margin:auto; }
.form-container { background:white; padding:20px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.1); transition:0.5s; margin-bottom:30px; }
body.dark .form-container { background:#2b2b2b; color:#fff; }
.form-container input, .form-container select { width:95%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ccc; font-size:16px; background:inherit; color:inherit; transition:0.3s; }
body.dark .form-container input, body.dark .form-container select { border:1px solid #555; }
.form-container button { padding:12px 20px; background:#4facfe; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; transition:0.3s; }
.form-container button:hover { background:#00f2fe; color:#333; }
body.dark .form-container button:hover { color:#fff; }
.error { color:red; margin-top:5px; }
.success { color:green; margin-top:5px; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { border:1px solid #ccc; padding:10px; text-align:left; }
body.dark th, body.dark td { border-color:#555; }
th { background:#4facfe; color:white; }
body.dark th { background:#00bfff; }
.low-stock { color:red; font-weight:bold; }
.links { margin-top:20px; }
.links a { color:#4facfe; text-decoration:none; font-weight:bold; }
.links a:hover { text-decoration:underline; }
</style>
</head>
<body>
<header>
<h1>Add Product</h1>
<div class="theme-toggle" onclick="toggleTheme()">🌙 Theme</div>
</header>
<main>
<div id="welcome" style="margin-bottom:15px; font-size:16px;"></div>

<div class="form-container" id="form-container">
<h2>Admin: Add / Upload Product</h2>
<input type="text" id="product-name" placeholder="Product Name" />
<input type="number" id="product-quantity" placeholder="Quantity (min 1)" min="1" />
<input type="number" id="product-cost" placeholder="Cost Price (₦)" min="1" />
<input type="number" id="product-selling" placeholder="Selling Price (₦)" min="1" />
<select id="product-category">
  <option value="">Select Category</option>
</select>
<button onclick="addProduct()">Add Product</button>
<div class="error" id="error"></div>
<div class="success" id="success"></div>
</div>

<h2>Current Stock</h2>
<table id="stock-table">
<thead>
<tr>
<th>ID</th>
<th>Product Name</th>
<th>Category</th>
<th>Quantity</th>
<th>Cost Price (₦)</th>
<th>Selling Price (₦)</th>
<th>Profit/Unit (₦)</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="links">
<a href="dashboard.html">← Back to Dashboard</a>
</div>
</main>

<script>
// ---------------- Theme
function toggleTheme() {
  document.body.classList.toggle('dark');
  sessionStorage.setItem('darkMode', document.body.classList.contains('dark'));
}
if(sessionStorage.getItem('darkMode')==='true') document.body.classList.add('dark');

// ---------------- Admin check
const role = sessionStorage.getItem('role') || 'admin';
const username = sessionStorage.getItem('username') || 'Admin';
document.getElementById('welcome').textContent = `Welcome, ${username.toUpperCase()} (${role.toUpperCase()})`;
if(role !== 'admin'){
  document.getElementById('form-container').innerHTML = '<p style="color:red;">Access Denied. Admin Only.</p>';
}

// ---------------- Categories
const categories = [
  'Dairy','Bakery','Beverages','Grains','Other','Drugs','Cream','Cosmetics','Underwear',
  'Stationeries','Drinks','Snacks','Frozen','Electronics','Household','PetCare','Health',
  'BabyCare','Cleaning','Accessories'
];
const categorySelect = document.getElementById('product-category');
categories.forEach(c=>{
  const opt = document.createElement('option');
  opt.value=c; opt.textContent=c;
  categorySelect.appendChild(opt);
});

// ---------------- Load / Init Products
function initProducts(){
  let stored = JSON.parse(sessionStorage.getItem('products') || '[]');
  // Check if preloaded products exist and have costPrice/sellingPrice
  if(!Array.isArray(stored) || stored.length===0 || !stored.every(p=> 'costPrice' in p && 'sellingPrice' in p)){
    stored = [
      {id:1, name:'Milk', category:'Dairy', quantity:250, costPrice:120, sellingPrice:200},
      {id:2, name:'Bread', category:'Bakery', quantity:300, costPrice:80, sellingPrice:150},
      {id:3, name:'Paracetamol', category:'Drugs', quantity:400, costPrice:50, sellingPrice:120},
      {id:4, name:'Face Cream', category:'Cream', quantity:220, costPrice:300, sellingPrice:500},
      {id:5, name:'Notebook', category:'Stationeries', quantity:500, costPrice:100, sellingPrice:250},
      {id:6, name:'Soda Drink', category:'Drinks', quantity:600, costPrice:70, sellingPrice:150},
      {id:7, name:'Chocolate Snack', category:'Snacks', quantity:350, costPrice:120, sellingPrice:250}
    ];
    sessionStorage.setItem('products', JSON.stringify(stored));
  }
  return stored;
}

// ---------------- Render Stock
function renderStock(){
  const storedProducts = initProducts();
  const tbody = document.querySelector('#stock-table tbody');
  tbody.innerHTML = '';
  storedProducts.forEach(p=>{
    const qty = Number(p.quantity)||0;
    const cp = Number(p.costPrice)||0;
    const sp = Number(p.sellingPrice)||0;
    const profit = sp - cp;
    const name = p.name || 'Unnamed';
    const category = p.category || 'Other';
    const id = p.id || 0;

    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${id}</td><td>${name}</td><td>${category}</td>
      <td>${qty}${qty<=5?'<span class="low-stock"> LOW STOCK</span>':''}</td>
      <td>₦${cp}</td><td>₦${sp}</td><td>₦${profit}</td>`;
    tbody.appendChild(tr);
  });
}
renderStock();

// ---------------- Add Product
function addProduct(){
  const name = document.getElementById('product-name').value.trim();
  const qty = parseInt(document.getElementById('product-quantity').value);
  const cp = parseFloat(document.getElementById('product-cost').value);
  const sp = parseFloat(document.getElementById('product-selling').value);
  const category = document.getElementById('product-category').value;
  const errorDiv = document.getElementById('error');
  const successDiv = document.getElementById('success');
  errorDiv.textContent = '';
  successDiv.textContent = '';

  if(!name || isNaN(qty) || isNaN(cp) || isNaN(sp) || !category){
    errorDiv.textContent = 'Please fill all fields correctly';
    return;
  }

  let storedProducts = initProducts();
  const id = storedProducts.length > 0 ? Math.max(...storedProducts.map(p=>p.id||0))+1 : 1;

  const newProduct = {id, name, category, quantity: qty, costPrice: cp, sellingPrice: sp};
  storedProducts.push(newProduct);
  sessionStorage.setItem('products', JSON.stringify(storedProducts));

  renderStock();
  successDiv.textContent = `${name} added successfully!`;

  document.getElementById('product-name').value='';
  document.getElementById('product-quantity').value='';
  document.getElementById('product-cost').value='';
  document.getElementById('product-selling').value='';
  document.getElementById('product-category').value='';

  window.dispatchEvent(new Event('storage'));
}
</script>
</body>
</html>
