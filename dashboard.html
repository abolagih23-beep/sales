<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini-Mart Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Segoe UI,sans-serif;margin:0;background:#f0f4f8;transition:.3s}
body.dark{background:#1e1e1e;color:#fff}
header{background:#4facfe;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
body.dark header{background:#00bfff}
main{padding:20px;max-width:1200px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 8px 20px rgba(0,0,0,.1)}
body.dark .card{background:#2b2b2b}
.card h3{margin:0;font-size:14px;color:#666}
body.dark .card h3{color:#ccc}
.card p{font-size:24px;font-weight:bold;margin-top:8px}
.alerts{margin-top:25px}
.alert{padding:12px;border-radius:10px;margin-bottom:10px;color:#fff;font-weight:bold}
.low{background:#ff6b6b}
.high{background:#ffa500}
.links{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.links a{padding:10px 15px;background:#4facfe;color:#fff;border-radius:8px;text-decoration:none;font-weight:bold}
body.dark .links a{background:#00bfff}
.links a:hover{background:#00f2fe;color:#333}
</style>
</head>

<body>

<header>
  <h2>📊 Mini-Mart Dashboard</h2>
  <div>
    <span style="cursor:pointer" onclick="toggleTheme()">🌙 Theme</span>
    <button onclick="logout()" style="margin-left:10px;background:#ff6b6b;border:none;color:#fff;padding:6px 12px;border-radius:6px">Logout</button>
  </div>
</header>

<main>
  <div id="welcome"></div>
  <div class="cards" id="cards"></div>
  <div class="alerts" id="alerts"></div>
  <div class="links" id="links"></div>
</main>

<script>
/* ---------- THEME ---------- */
if(sessionStorage.getItem('darkMode')==='true') document.body.classList.add('dark')
function toggleTheme(){
  document.body.classList.toggle('dark')
  sessionStorage.setItem('darkMode', document.body.classList.contains('dark'))
}

/* ---------- AUTH ---------- */
const username = sessionStorage.getItem('username')
const role = sessionStorage.getItem('role') || 'staff'
if(!username){
  alert('Login required')
  location.href='index.html'
}
document.getElementById('welcome').textContent =
  `Welcome, ${username} (${role.toUpperCase()})`

/* ---------- STORAGE HELPERS ---------- */
const getProducts = ()=>JSON.parse(sessionStorage.getItem('products') || '[]')
const setProducts = (arr)=>sessionStorage.setItem('products', JSON.stringify(arr))
const getSales = ()=>JSON.parse(sessionStorage.getItem('sales') || '[]')
const setSales = (arr)=>sessionStorage.setItem('sales', JSON.stringify(arr))

/* ---------- INITIAL DATA ---------- */
if(!sessionStorage.getItem('products')){
  setProducts([
    {id:1,name:'Milk',category:'Dairy',quantity:20,costPrice:150,sellingPrice:200},
    {id:2,name:'Bread',category:'Bakery',quantity:15,costPrice:100,sellingPrice:150},
    {id:3,name:'Eggs',category:'Dairy',quantity:30,costPrice:10,sellingPrice:15},
    {id:4,name:'Juice',category:'Beverages',quantity:10,costPrice:250,sellingPrice:300},
    {id:5,name:'Rice',category:'Grains',quantity:50,costPrice:400,sellingPrice:500}
  ])
}
if(!sessionStorage.getItem('sales')){
  setSales([])
}

/* ---------- DASHBOARD LOGIC ---------- */
function renderDashboard(){
  const products = getProducts()
  const sales = getSales()

  const cardsDiv = document.getElementById('cards')
  const alertsDiv = document.getElementById('alerts')
  cardsDiv.innerHTML = ''
  alertsDiv.innerHTML = ''

  /* ---- CALCULATE METRICS ---- */
  const totalRevenue = sales.reduce((a,s)=>a + (Number(s.sellingPrice) || 0) * (Number(s.quantity) || 0),0)
  const totalProfit = sales.reduce((a,s)=>a + (Number(s.profit) || 0),0)
  const itemsSold = sales.reduce((a,s)=>a + (Number(s.quantity) || 0),0)
  const totalStockQty = products.reduce((a,p)=>a + (Number(p.quantity) || 0),0)

  const lowStock = products.filter(p=>p.quantity <= 5)

  const demandMap = {}
  sales.forEach(s=>{
    demandMap[s.productName] = (demandMap[s.productName] || 0) + Number(s.quantity || 0)
  })
  const highDemand = Object.keys(demandMap).filter(p=>demandMap[p] >= 5)

  /* ---- CARDS ---- */
  const data = [
    ['Total Revenue (₦)', totalRevenue.toLocaleString()],
    ...(role==='admin'? [['Total Profit (₦)', totalProfit.toLocaleString()]] : []),
    ['Items Sold', itemsSold],
    ['Total Stock Qty', totalStockQty],
    ['Low Stock Items', lowStock.length],
    ['High Demand Items', highDemand.length]
  ]
  data.forEach(d=>{
    const div = document.createElement('div')
    div.className='card'
    div.innerHTML = `<h3>${d[0]}</h3><p>${d[1]}</p>`
    cardsDiv.appendChild(div)
  })

  /* ---- ALERTS ---- */
  if(lowStock.length){
    lowStock.forEach(p=>{
      alertsDiv.innerHTML+=`<div class="alert low">⚠️ Low Stock: ${p.name} (${p.quantity})</div>`
    })
  }
  if(highDemand.length){
    highDemand.forEach(p=>{
      alertsDiv.innerHTML+=`<div class="alert high">🔥 High Demand: ${p} (${demandMap[p]} sold)</div>`
    })
  }
  if(!lowStock.length && !highDemand.length){
    alertsDiv.innerHTML='<div>No alerts currently.</div>'
  }
}

/* ---------- LINKS ---------- */
const linksDiv = document.getElementById('links')
const adminLinks = [
  ['Add Product','add-product.html'],
  ['Product List','product-list.html'],
  ['Record Sale','record-sale.html'],
  ['Reports','reports.html'],
  ['Staff Accountability','staff-accountability.html']
]
const staffLinks = [
  ['Product List','product-list.html'],
  ['Record Sale','record-sale.html']
]
;(role==='admin'?adminLinks:staffLinks).forEach(l=>{
  const a = document.createElement('a')
  a.href = l[1]
  a.textContent = l[0]
  linksDiv.appendChild(a)
})

/* ---------- LOGOUT ---------- */
function logout(){
  if(confirm('Logout now?')){
    // Only remove session info, NOT products/sales
    sessionStorage.removeItem('username')
    sessionStorage.removeItem('role')
    location.href='index.html'
  }
}

/* ---------- LIVE UPDATE ---------- */
window.addEventListener('storage', renderDashboard)
renderDashboard()
</script>

</body>
</html>
